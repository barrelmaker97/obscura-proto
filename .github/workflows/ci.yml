name: Protobuf CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token this action resolves its download URL through the unauthenticated
          # GitHub API and fails the whole job on a shared-runner rate limit — observed
          # 2026-07-25 on a docs-only PR. The gate must fail for contract reasons, not
          # because a neighbouring runner used up the quota.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-lint-action@v1

  breaking:
    name: Check Breaking Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token this action resolves its download URL through the unauthenticated
          # GitHub API and fails the whole job on a shared-runner rate limit — observed
          # 2026-07-25 on a docs-only PR. The gate must fail for contract reasons, not
          # because a neighbouring runner used up the quota.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-breaking-action@v1
        with:
          # Compares the PR branch against the 'main' branch
          against: 'https://github.com/${{ github.repository }}.git#branch=main'
