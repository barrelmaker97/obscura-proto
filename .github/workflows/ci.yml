name: Protobuf CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-lint-action@v1

  breaking:
    name: Check Breaking Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-breaking-action@v1
        with:
          # Compares the PR branch against the 'main' branch
          against: 'https://github.com/${{ github.repository }}.git#branch=main'

  # Validate the L3 conformance vectors are well-formed. This is proto's
  # UPSTREAM responsibility only: the artifacts must be coherent (valid JSON,
  # expected structure, no orphan files, spec-referenced). Whether a KIT
  # satisfies a vector is the consumer's job, gated in each kit's own CI when
  # it adopts a new proto commit (submodule bump) — proto never builds a kit.
  # Pure stdlib; see conformance/README.md and conformance/validate.py.
  conformance-vectors:
    name: Validate Conformance Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 conformance/validate.py
